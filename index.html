<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI TTS 음성 변환기 PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.7);
      --accent-color: #818cf8;
      --accent-gradient: linear-gradient(135deg, #818cf8, #c084fc);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(192, 132, 252, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 35px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 14px;
    }

    .info {
      padding: 16px;
      margin-bottom: 25px;
      border-radius: 16px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: #fcd34d;
      font-size: 13.5px;
      line-height: 1.6;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      color: var(--text-muted);
    }

    select, input, textarea {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: white;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s;
    }

    select, input { height: 46px; padding: 0 12px; font-size: 14px; }
    textarea { width: 100%; min-height: 140px; padding: 16px; font-size: 15px; line-height: 1.6; resize: vertical; }
    select:focus, input:focus, textarea:focus { border-color: var(--accent-color); }

    .counter-row { display: flex; justify-content: flex-end; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .button-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }

    button, .download-link {
      border: none; border-radius: 12px; padding: 0 24px; height: 48px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    }

    .clear-btn { background: #334155; color: #94a3b8; }
    .make-btn { background: var(--accent-gradient); color: #0f172a; box-shadow: 0 4px 14px rgba(129, 140, 248, 0.4); }
    .make-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; box-shadow: none; }
    .download-link { background: linear-gradient(135deg, #a855f7, #ec4899); color: white; }

    .status-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; }
    .spinner { width: 24px; height: 24px; border: 3px solid rgba(255, 255, 255, 0.1); border-top-color: var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 14px; color: var(--accent-color); text-align: center; }

    .result-box { margin-top: 25px; padding: 20px; border-radius: 16px; background: rgba(15, 23, 42, 0.4); border: 1px solid var(--border-color); }
    audio { width: 100%; margin-top: 10px; filter: invert(0.9) hue-rotate(180deg); }
    .fb-url { margin-top: 10px; font-size: 12px; color: #34d399; word-break: break-all; text-align: center; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔊 AI TTS 음성 변환기 PRO</h1>
    <div class="subtitle">GitHub Pages + Firebase 클라우드 인프라 연동형</div>

    <div class="info">
      <strong>⚡ 김민재님 전용 시스템 아키텍처</strong><br />
      텍스트 입력 ➔ Google Apps Script 웹앱 통신 ➔ OpenAI TTS 변환 ➔ ggggg 프로젝트 파이어베이스 저장소 백업
    </div>

    <div class="option-grid">
      <div class="input-group">
        <label for="modelSelect">AI 엔진 모델</label>
        <select id="modelSelect">
          <option value="tts-1">tts-1 (속도 최적화)</option>
          <option value="tts-1-hd">tts-1-hd (음질 최적화)</option>
        </select>
      </div>
      <div class="input-group">
        <label for="voiceSelect">보이스 선택</label>
        <select id="voiceSelect">
          <option value="alloy">Alloy (중성)</option>
          <option value="echo">Echo (남성)</option>
          <option value="nova">Nova (여성)</option>
          <option value="shimmer">Shimmer (여성)</option>
        </select>
      </div>
      <div class="input-group">
        <label for="speedInput">재생 속도</label>
        <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" />
      </div>
    </div>

    <div class="input-group">
      <label for="textInput">변환할 텍스트</label>
      <textarea id="textInput" placeholder="이곳에 문장을 입력하고 버튼을 누르거나 Ctrl + Enter를 누르세요."></textarea>
      <div class="counter-row"><span id="charCount">0</span> / 4096자</div>
    </div>

    <div class="button-row">
      <button class="clear-btn" id="clearBtn">초기화</button>
      <button class="make-btn" id="makeBtn">음성 생성 및 클라우드 저장</button>
    </div>

    <div id="statusContainer" class="status-container hidden">
      <div class="spinner"></div>
      <div id="statusText" class="status-text">대기 중...</div>
    </div>

    <div id="resultBox" class="result-box hidden">
      <label style="font-size: 13px; color: var(--text-muted);">🎵 생성된 오디오 플레이어</label>
      <audio id="audioPlayer" controls></audio>
      <div id="firebaseUrl" class="fb-url"></div>
      <div class="button-row">
        <a id="downloadLink" class="download-link" href="#" download="tts-audio.mp3">📥 로컬 기기에 다운로드</a>
      </div>
    </div>
  </div>
