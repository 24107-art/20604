<html lang="ko">

  <title>AI 경제 비서 & TTS 클라우드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.7);
      --accent-color: #818cf8;
      --accent-gradient: linear-gradient(135deg, #818cf8, #c084fc);
      --economy-gradient: linear-gradient(135deg, #34d399, #059669);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(52, 211, 153, 0.1) 0px, transparent 50%);
      color: var(--text-main); display: flex; justify-content: center; align-items: center; padding: 20px;
    }

    .container { width: 100%; max-width: 700px; background: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); backdrop-filter: blur(16px); border: 1px solid var(--border-color); }
    h1 { text-align: center; font-size: 26px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
    .subtitle { text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }

    .auth-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.5); padding: 12px 20px; border-radius: 14px; margin-bottom: 25px; border: 1px solid var(--border-color); }
    .user-info { font-size: 14px; color: #a5b4fc; font-weight: 500; }
    
    .btn { border: none; border-radius: 10px; padding: 0 18px; height: 42px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .login-btn { background: #ffffff; color: #1e293b; box-shadow: 0 4px 12px rgba(255,255,255,0.1); }
    .logout-btn { background: #ef4444; color: white; }

    .main-box { transition: all 0.3s ease; }
    .blur-mode { filter: blur(5px); pointer-events: none; opacity: 0.2; }

    .section-title { font-size: 15px; font-weight: 700; color: #f3f4f6; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-title.econ { color: #34d399; }

    .option-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 15px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
    .input-group label { font-size: 13px; color: var(--text-muted); }
